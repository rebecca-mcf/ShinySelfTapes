document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

d: var(--ink); color: var(--cream);\n      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden;\n      font-feature-settings: \"kern\" 1, \"liga\" 1;\n    }\n    a { color: inherit; text-decoration: none; }\n    button { font-family: inherit; cursor: pointer; }\n    img { display: block; max-width: 100%; }\n\n    .disp { font-family: 'Cormorant Garamond', serif; font-feature-settings: \"kern\" 1, \"liga\" 1, \"onum\" 1; }\n    .disp em { font-style: italic; color: var(--gold-light); }\n\n    .h1, .h2, .h3 {\n      font-family: 'Cormorant Garamond', serif; font-weight: 600; color: var(--cream);\n      margin: 0; text-wrap: balance;\n    }\n    .h1 { font-size: var(--fs-h1); line-height: var(--lh-tight); letter-spacing: var(--ls-display-lg); }\n    .h2 { font-size: var(--fs-h2); line-height: var(--lh-snug); letter-spacing: var(--ls-display-md); }\n    .h3 { font-size: var(--fs-h3); line-height: 1.25; letter-spacing: var(--ls-display-md); font-weight: 600; }\n\n    .body-lg { font-size: var(--fs-body-lg); line-height: var(--lh-body-lg); }\n    .body    { font-size: var(--fs-body);    line-height: var(--lh-body); }\n    .small   { font-size: var(--fs-small);   line-height: 1.5; }\n\n    .price {\n      font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: var(--fs-price);\n      letter-spacing: var(--ls-display-md); color: var(--gold);\n      font-variant-numeric: oldstyle-nums; font-feature-settings: \"onum\" 1;\n    }\n    .price .cur { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 400; color: var(--text-muted); font-variant-numeric: normal; }\n\n    .cont { max-width: 1120px; margin: 0 auto; padding: 0 32px; position: relative; z-index: 2; }\n\n    .eyebrow {\n      font-size: var(--fs-eyebrow); font-weight: 600; letter-spacing: var(--ls-eyebrow);\n      text-transform: uppercase; color: var(--gold); margin-bottom: 16px;\n      display: flex; align-items: center; gap: 10px; font-variant-numeri nt-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;\n      padding: 5px 16px; border-radius: 999px; white-space: nowrap;\n    }\n\n    .quote-mark { font-family: 'Cormorant Garamond', serif; font-size: 56px; line-height: 1; color: var(--gold); opacity: 0.4; margin-bottom: -6px; }\n\n    #mob-cta { display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; background: var(--ink-3); padding: 14px 20px; text-align: center; transform: translateY(100%); transition: transform .3s ease; border-top: 1px solid var(--rule); }\n    @media (max-width: 700px) { #mob-cta { display: block; } }\n\n    /* Hand-drawn sparkle doodles — literalises \"Shiny,\" line-art not glitter */\n    .sparkle {\n      fill: var(--gold-light); filter: drop-shadow(0 0 6px rgba(232,197,108,0.45));\n      animation: twinkle 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center;\n      position: absolute; pointer-events: none;\n    }\n    @keyframes twinkle {\n      0%, 100% { opacity: 0.55; transform: scale(0.82) rotate(var(--rot, 0deg)); }\n      50%      { opacity: 1;    transform: scale(1)    rotate(var(--rot, 0deg)); }\n    }\n    @media (prefers-reduced-motion: reduce) { .sparkle { animation: none; opacity: 0.85; } }\n  <\u002Fstyle>\n  <script type=\"application/ld+json\">\n  {\"@context\":\"https://schema.org\",\"@type\":\"LocalBusiness\",\"name\":\"Shiny Self-Tapes\",\"description\":\"Self-tape studio and acting coaching in Orewa, Auckland, run by professional actor Rebecca McFadzien.\",\"address\":{\"@type\":\"PostalAddress\",\"addressLocality\":\"Orewa\",\"addressRegion\":\"Auckland\",\"addressCountry\":\"NZ\"},\"areaServed\":\"Auckland, New Zealand\"}\n  <\u002Fscript>\n  <script type=\"application/ld+json\">\n  {\"@context\":\"https://schema.org\",\"@type\":\"FAQPage\",\"mainEntity\":[\n    {\"@type\":\"Question\",\"name\":\"What is a self-tape audition?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"A self-tape is a video audition you film yourself, using a reader to deliver the other character's lines, and send to a casting director in place of an in-person audition. Most auditions today are cast this way.\"}},\n    {\"@type\":\"Question\",\"name\":\"How fast can I get my self-tape done?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Most self-tape sessions are booked, filmed, directed and delivered within 24 hours, ideal for auditions that drop with only a day or two's notice.\"}},\n    {\"@type\":\"Question\",\"name\":\"Do I need to bring my own reader?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"No. Every session includes an in-person reader and director, you just arrive with your lines learned and ready to shoot.\"}},\n    {\"@type\":\"Question\",\"name\":\"Can my child do a self-tape session?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes, child auditions are a regular part of the studio. Direction is handled for you, so parents don't have to coach or film on their own.\"}},\n    {\"@type\":\"Question\",\"name\":\"Where is the studio located?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"The studio is in Orewa, on Auckland's Hibiscus Coast, with in-person sessions by booking.\"}}\n  ]}\n  <\u002Fscript>\n  <script src=\"e242bbed-cd3b-4a7a-a01b-16cf0fbcfb14\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n\n\n<!-- Reusable hand-drawn sparkle glyph -->\n<svg width=\"0\" height=\"0\" style=\"position:absolute\">\n  <symbol id=\"spark-4\" viewBox=\"0 0 32 32\">\n    <path d=\"M16 1c1.3 8.1 4.9 12.8 15 15-10.1 2.2-13.7 6.9-15 15-1.3-8.1-4.9-12.8-15-15 10.1-2.2 13.7-6.9 15-15z\"><\u002Fpath>\n  <\u002Fsymbol>\n  <symbol id=\"spark-6\" viewBox=\"0 0 32 32\">\n    <path d=\"M15 2c1 6 2.6 9.7 6.4 12.2 3 2 5.6 2.4 8.6 2.8-3.6 1-6.7 2-9.4 4.6-2.7 2.6-4 5.6-4.8 9.4-1-6-2.7-9.6-6.3-12.1-3-2.1-5.7-2.5-8.7-2.9 3.7-1 6.8-2 9.5-4.6 2.6-2.6 3.9-5.6 4.7-9.4z\"><\u002Fpath>\n  <\u002Fsymbol>\n  <symbol id=\"doodle-underline\" viewBox=\"0 0 200 14\">\n    <pat se><\u002Fsvg>\n  <div class=\"cont\" id=\"hero-grid\" style=\"display:grid;grid-template-columns:1.1fr 0.9fr;gap:56px;align-items:center\">\n    <div class=\"rev in\">\n      <div class=\"eyebrow\">Self-tape studio &amp; acting coach in Orewa, Auckland<\u002Fdiv>\n      <h1 class=\"h1 disp\" style=\"margin:0 0 22px;max-width:560px;position:relative\">\n        <svg class=\"sparkle\" style=\"width:26px;height:26px;top:-22px;left:-6px;--rot:-10deg\"><use href=\"#spark-4\"><\u002Fuse><\u002Fsvg>\n        <em>Direction<\u002Fem> from someone who's actually sat in your chair.\n      <\u002Fh1>\n      <p class=\"body-lg\" style=\"color:var(--text-muted);max-width:460px;margin:0 0 32px\">Polished self-tapes, directed and delivered to showcase your best work. Submit your next audition with confidence.<\u002Fp>\n      <div class=\"small card\" style=\"color:var(--gold-light);margin:0 0 28px;padding:12px 18px;display:inline-flex;align-items:center;gap:12px;max-width:460px\">\n        <image-slot id=\"hero-credit-photo\" shape=\"circle\" fit=\"cover\" placeholder=\"Tigerlily\" style=\"width:36px;height:36px;flex:none\" src=\"e8369776-cdb6-4aa4-a197-db7ff3c0dce9\"><\u002Fimage-slot>\n        <span>Tigerlily Allison, aged 8, booked her dream role with <strong>Emilia Clarke<\u002Fstrong> in <strong><a href=\"https://www.imdb.com/title/tt12681512/\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:inherit;text-decoration:underline\">When Darkness Loves Us<\u002Fa><\u002Fstrong>.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:20px;align-items:center;flex-wrap:wrap\">\n        <a href=\"#pricing\" class=\"btn\">Book your session →<\u002Fa>\n        <a href=\"#doors\" class=\"btn-outline\">Not sure which session you need? →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"hero-photo\" class=\"hero-img card photo-frame\" style=\"overflow:hidden;min-height:420px;height:100%;align-self:stretch;position:relative;transition:transform .3s ease;will-change:transform\">\n      <image-slot id=\"hero-photo-slot\" shape=\"rect\" fit=\"cover\" placeholder=\"Rebecca directing a client, sharp focus on faces, warm low light\" style=\"width:100%;height:100%\" src=\"52f91d6f-cbea-4f8a-a677-5c5afa4ff707\"><\u002Fimage-slot>\n      <svg class=\"sparkle\" style=\"width:20px;height:20px;top:18px;right:18px;--rot:-14deg;z-index:2;pointer-events:none\"><use href=\"#spark-6\"><\u002Fuse><\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"divider\"><\u002Fdiv>\n\n<!-- 2. Segment picker -->\n<section id=\"doors\" style=\"background:var(--ink-3);padding:80px 0;position:relative;overflow:hidden\">\n  <div class=\"glow\" style=\"width:420px;height:420px;top:-200px;left:50%;transform:translateX(-50%);background:radial-gradient(circle, rgba(120,100,170,0.12), transparent 70%)\"><\u002Fdiv>\n  <svg class=\"sparkle drift\" style=\"width:14px;height:14px;top:24px;left:12%;--rot:-10deg\"><use href=\"#spark-4\"><\u002Fuse><\u002Fsvg>\n  <svg class=\"sparkle drift\" style=\"width:18px;height:18px;top:54px;right:14%;--rot:16deg;animation-delay:1s\"><use href=\"#spark-6\"><\u002Fuse><\u002Fsvg>\n  <div class=\"cont\">\n    <div class=\"rev\" style=\"text-align:center;margin-bottom:48px;position:relative\">\n      <div class=\"eyebrow center\" style=\"justify-content:center\">Lights, camera, action.<\u002Fdiv>\n      <h2 class=\"h2 disp\" style=\"display:inline-block;position:relative\">\n        Welcome, what brings you here?\n        <svg class=\"sparkle\" style=\"width:18px;height:18px;top:-14px;right:-26px;--rot:14deg\"><use href=\"#spark-4\"><\u002Fuse><\u002Fsvg>\n      <\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"rev d2\" style=\"display:flex;flex-direction:column;gap:16px;max-width:760px;margin:0 auto\">\n      <div class=\"acc-item card is-active\" data-acc=\"parents\" style=\"border:1px solid var(--rule);background:var(--ink-2);overflow:hidden\">\n        <button type=\"button\" class=\"acc-head tab-btn is-active\" data-tab=\"parents\" style=\"display:flex;align-items:center;gap:18px;width:100%;text-align:left;color:inherit;font:inherit;background:none;border:none;padding:26px 28px;cursor:pointer\">\n          <div class=\"num-chip\" style=\"flex:none\">1<\u002Fdiv>\n          <div style=\"flex:1\">\n            <div class=\"h3 disp\" style=\"margin-bottom:4px\">I need a self-tape for my kid's audition<\u002Fdiv>\n            <p class=\"small\" style=\"color:var(--text-muted);margin:0\">You're busy and have no idea where to start.<\u002Fp>\n          <\u002Fdiv>\n          <svg class=\"acc-chevron\" viewBox=\"0 0 24 24\" style=\"width:18px;height:18px;flex:none;stroke:var(--gold);fill:none;stroke-width:2;transition:transform .3s ease\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fbutton>\n        <div class=\"acc-panel tab-panel\" data-panel=\"parents\" style=\"padding:24px 28px 32px;border-top:1px solid var(--rule)\">\n          <p class=\"body-lg\" style=\"color:var(--cream);margin:0 0 28px;opacity:0.9\">Directing your own child can be hard, and forcing it usually just adds pressure. That's a directing problem, not a parenting one, and it's mine to solve. I love working with kids and bringing out their sparkle.<\u002Fp>\n          <a href=\"#book\" class=\"btn\">Book your child's session →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"acc-item card\" data-acc=\"actors\" style=\"border:1px solid var(--rule);background:var(--ink-2);overflow:hidden\">\n        <button type=\"button\" class=\"acc-head tab-btn\" data-tab=\"actors\" style=\"display:flex;align-items:center;gap:18px;width:100%;text-align:left;color:inherit;font:inherit;background:none;border:none;padding:26px 28px;cursor:pointer\">\n          <div class=\"num-chip\" style=\"flex:none\">2<\u002Fdiv>\n          <div style=\"flex:1\">\n            <div class=\"h3 disp\" style=\"margin-bottom:4px\">I'm a working actor and I need a great tape<\u002Fdiv>\n            <p class=\"small\" style=\"color:var(--text-muted);margin:0\">Exciting audition dropped last minute? Don't stress, let's make it happen.<\u002Fp>\n          <\u002Fdiv>\n          <svg class=\"acc-chevron\" viewBox=\"0 0 24 24\" style=\"width:18px;height:18px;flex:none;stroke:var(--gold);fill:none;stroke-width:2;transition:transform .3s ease\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fbutton>\n        <div class=\"acc-panel tab-panel\" data-panel=\"actors\" style=\"padding:24px 28px 32px;border-top:1px solid var(--rule);display:none\">\n          <p class=\"body-lg\" style=\"color:var(--cream);margin:0 0 16px;opacity:0.9\">Auditions drop with 24–48 hours' notice. Scrambling for a reader, a decent camera, and someone who actually knows what's being cast for shouldn't be part of the job. I've been in your seat and know what it takes to get booked.<\u002Fp>\n          <a href=\"#book\" class=\"btn\">Book your session →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"acc-item card\" data-acc=\"coaching\" style=\"border:1px solid var(--rule);background:var(--ink-2);overflow:hidden\">\n        <button type=\"button\" class=\"acc-head tab-btn\" data-tab=\"coaching\" style=\"display:flex;align-items:center;gap:18px;width:100%;text-align:left;color:inherit;font:inherit;background:none;border:none;padding:26px 28px;cursor:pointer\">\n          <div class=\"num-chip\" style=\"flex:none\">3<\u002Fdiv>\n          <div style=\"flex:1\">\n            <div class=\"h3 disp\" style=\"margin-bottom:4px\">I want to get better at this<\u002Fdiv>\n            <p class=\"small\" style=\"color:var(--text-muted);margin:0\">Freezing up on camera? Build the confidence behind the tape.<\u002Fp>\n          <\u002Fdiv>\n          <svg class=\"acc-chevron\" viewBox=\"0 0 24 24\" style=\"width:18px;height:18px;flex:none;stroke:var(--gold);fill:none;stroke-width:2;transition:transform .3s ease\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fbutton>\n        <div class=\"acc-panel tab-panel\" data-panel=\"coaching\" style=\"padding:24px 28px 32px;border-top:1px solid var(--rule);display:none\">\n          <p class=\"body-lg\" style=\"color:var(--cream);margin:0 0 28px;opacity:0.9\">Camera confidence, not talent, is usually what's holding you back. One-on-one coaching on scene work, framing, and audition technique, from someone who's done this professionally for 17+ years.<\u002Fp>\n          <a href=\"#book\" class=\"btn\">Book a coaching session →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"divider\"><\u002Fdiv>\n\n<!-- 6. About Rebecca -->\n<section id=\"about\" style=\"background:var(--ink-3);padding:96px 0;position:relative;overflow:hidden\">\n  <div class=\"glow\" style=\"width:380px;height:380px;top:-100px;right:-80px;background:radial-gradient(circle, rgba(120,100,170,0.13), transparent 70%)\"><\u002Fdiv>\n  <svg class=\"sparkle drift\" style=\"width:16px;height:16px;top:34px;right:64px;--rot:8deg\"><use href=\"#spark-4\"><\u002Fuse><\u002Fsvg>\n  <svg class=\"sparkle drift\" style=\"width:11px;height:11px;bottom:60px;left:44px;--rot:-16deg;animation-delay:1.4s\"><use href=\"#spark-4\"><\u002Fuse><\u002Fsvg>\n  <div class=\"cont rev\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center\">\n    <div>\n      <div class=\"eyebrow\">About Rebecca McFadzien, Your Director and Unofficial Cheerleader<\u002Fdiv>\n      <h2 class=\"h2 disp\" style=\"margin:0 0 24px\">I've been on your side of the camera.<\u002Fh2>\n      <p class=\"body-lg\" style=\"color:var(--text-muted);margin:0 0 16px\">Rebecca was born just off-Broadway in New York City, and she's been performing ever since. She's stood in front of the camera more times than she can count — so she knows exactly what your nerves feel like, and exactly what a casting director wants to see.<\u002Fp>\n      <p ectionObserver' in window)) { els.forEach(function(e){ e.classList.add('in'); }); return; }\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) { entry.target.classList.add('in'); io.unobserve(entry.target); }\n      });\n    }, { threshold: 0.15 });\n    els.forEach(function (e) { io.observe(e); });\n  })();\n<\u002Fscript>\n<script>\n  (function () {\n    var hero = document.getElementById('hero-photo');\n    var wrap = document.getElementById('hero-grid');\n    if (!hero || !wrap || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    wrap.addEventListener('mousemove', function (e) {\n      var r = wrap.getBoundingClientRect();\n      var x = (e.clientX - r.left) / r.width - 0.5;\n      var y = (e.clientY - r.top) / r.height - 0.5;\n      hero.style.transform = 'perspective(800px) rotateY(' + (x * 6).toFixed(2) + 'deg) rotateX(' + (-y * 6).toFixed(2) + 'deg)';\n    });\n    wrap.addEventListener('mouseleave', function () { hero.style.transform = ''; });\n  })();\n<\u002Fscript>\n<script>\n  (function () {\n    var btns = document.querySelectorAll('.tab-btn');\n    var panels = document.querySelectorAll('.tab-panel');\n    var items = document.querySelectorAll('.acc-item');\n    btns.forEach(function (b) {\n      b.addEventListener('click', function () {\n        var alreadyOpen = b.classList.contains('is-active');\n        btns.forEach(function (x) { x.classList.remove('is-active'); });\n        panels.forEach(function (p) { p.classList.remove('is-active'); p.style.display = 'none'; });\n        items.forEach(function (i) { i.classList.remove('is-active'); });\n        if (!alreadyOpen) {\n          b.classList.add('is-active');\n          var panel = document.querySelector('.tab-panel[data-panel=\"' + b.dataset.tab + '\"]');\n          panel.classList.add('is-active'); panel.style.display = 'block';\n          var item = document.querySelector('.acc-item[data-acc=\"' + b.dataset.tab + '\"]');\n          item.classList.add('is-active');\n        }\n      });\n    });\n  })();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
